name: Pruebas

on:
  pull_request:
  push:
    branches: [main]
    paths: ["monitor/**", "tests/**", "main.py", "requirements.txt"]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
